[project]
name = "agentops-ai"
version = "0.1.0"
description = "Production-minded agentic RAG platform: harness, agent loop, LangGraph, hybrid retrieval, evaluation, and drift monitoring on local Ollama models."
requires-python = ">=3.13"
# Ranges here; exact resolved versions are pinned in uv.lock (commit it, install with `uv sync --frozen`).
dependencies = [
    "alembic>=1.20.0,<2",
    "asyncpg>=0.32.0,<0.33",
    "fastapi[standard]>=0.159.1,<0.160",
    "httpx>=0.28.1,<0.29",
    "pgvector>=0.5.1,<0.6",
    "pydantic-settings>=2.16.1,<3",
    "pypdf>=6.21.2,<7",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "typer>=0.27.3,<0.28",
]

[project.scripts]
agentops = "app.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL with pgvector (docker compose up -d db)",
    "live: calls the real local Ollama server; opt in with -m live",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
