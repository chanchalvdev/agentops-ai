name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops
          POSTGRES_DB: agentops
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agentops" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      AGENTOPS_REQUIRE_DB: "1" # a missing database fails CI instead of skipping tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy app
      - run: uv run pytest -q # live Ollama tests are excluded by default (-m 'not live')
      # Regression gate on the committed live baseline (no model needed: it reads the report).
      # After a live `agentops eval run --out new.json`, gate it with --baseline the same way.
      - run: uv run agentops eval check datasets/baselines/golden-v1-graph-qwen3-8b.json
      # Day 4: the committed benchmark runs must still satisfy the same gate (reads files only).
      - run: uv run agentops eval check datasets/baselines/golden-v1-graph-qwen3-8b-optimized.json --baseline datasets/baselines/golden-v1-graph-qwen3-8b-day4.json
      - run: uv run agentops experiment list

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentops-ai:ci .
      # The image must start far enough to import the app and print the CLI help.
      - run: docker run --rm agentops-ai:ci agentops --help
