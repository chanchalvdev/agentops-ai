name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops
          POSTGRES_DB: agentops
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agentops" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      AGENTOPS_REQUIRE_DB: "1" # a missing database fails CI instead of skipping tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy app
      - run: uv run pytest -q # live Ollama tests are excluded by default (-m 'not live')
